AWSTemplateFormatVersion: '2010-09-09'
Description: Optional private S3 bucket for reviewed HeatShift Lambda packages. Creates a metered storage resource.
Resources:
  Packages:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldDeploymentPackages
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Application
          Value: HeatShift
Outputs:
  ArtifactBucket:
    Description: Use this private bucket name in the app template. Empty and delete it separately after the demo.
    Value: !Ref Packages
